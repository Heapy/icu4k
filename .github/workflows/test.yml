name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  jvm-js-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/generate-data.py --check
      - run: ./gradlew jvmTest jsNodeTest linuxX64Test --console=plain
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew macosArm64Test --console=plain
